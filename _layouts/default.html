<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
{% include head.html %}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap');

  :root {
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --bg: #050b18;
    --bg2: #0a1628;
    --card: rgba(0,229,255,0.04);
    --border: rgba(0,229,255,0.15);
    --text: #e2eaf8;
    --text-muted: #7a90b8;
  }

  body {
    background: var(--bg) !important;
    color: var(--text) !important;
    font-family: 'Inter', sans-serif !important;
    transition: background 0.4s, color 0.4s;
    margin: 0;
  }

  /* ── LIGHT MODE ── */
  body.light-mode {
    --accent: #0077cc;
    --accent2: #6d28d9;
    --bg: #f0f4ff;
    --bg2: #ffffff;
    --card: rgba(0,119,204,0.05);
    --border: rgba(0,119,204,0.18);
    --text: #0f172a;
    --text-muted: #4a5568;
  }
  body.light-mode { background: var(--bg) !important; color: var(--text) !important; }

  /* ── HEADER ── */
  header {
    background: rgba(5,11,24,0.85) !important;
    backdrop-filter: blur(16px) !important;
    border-bottom: 1px solid var(--border) !important;
    position: sticky; top: 0; z-index: 1000;
    transition: background 0.4s;
  }
  body.light-mode header {
    background: rgba(255,255,255,0.92) !important;
    border-bottom: 1px solid rgba(0,119,204,0.2) !important;
  }

  header h1 a,
  header a,
  header nav a,
  header .page-link,
  header .site-title {
    color: var(--accent) !important;
    text-decoration: none !important;
    font-family: 'Fira Code', monospace !important;
    font-weight: 600 !important;
    background: transparent !important;
    background-color: transparent !important;
    transition: color 0.3s, text-shadow 0.3s;
  }
  header a:hover, header nav a:hover {
    color: #ffffff !important;
    text-shadow: 0 0 12px var(--accent);
  }
  body.light-mode header h1 a,
  body.light-mode header a,
  body.light-mode header nav a,
  body.light-mode header .page-link,
  body.light-mode header .site-title {
    color: var(--accent) !important;
    background: transparent !important;
    background-color: transparent !important;
  }

  header .site-nav,
  header nav,
  header .trigger {
    background: transparent !important;
    background-color: transparent !important;
  }
  body.light-mode header .site-nav,
  body.light-mode header nav,
  body.light-mode header .trigger {
    background: transparent !important;
    background-color: transparent !important;
  }

  /* ── FOOTER ── */
  footer {
    background: var(--bg2) !important;
    border-top: 1px solid var(--border) !important;
    color: var(--text-muted) !important;
    font-size: 13px;
    padding: 16px 24px;
    text-align: center;
  }
  footer a { color: var(--accent) !important; }

  /* ── GLOBAL CONTENT ── */
  .page-content, article, main, .post-content {
    background: transparent !important;
    color: var(--text) !important;
  }
  h1, h2, h3, h4 { color: var(--text) !important; }
  p, li, span, td, th { color: var(--text) !important; }
  body.light-mode h1, body.light-mode h2,
  body.light-mode h3, body.light-mode p,
  body.light-mode li, body.light-mode span { color: var(--text) !important; }

  /* ── THEME BUTTON ── */
  #global-theme-btn {
    position: fixed;
    top: 14px; right: 18px;
    z-index: 99999;
    background: rgba(0,229,255,0.1);
    border: 1.5px solid var(--accent);
    border-radius: 50px;
    padding: 7px 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 12px;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
    box-shadow: 0 0 16px rgba(0,229,255,0.2);
  }
  #global-theme-btn:hover {
    background: rgba(0,229,255,0.2);
    box-shadow: 0 0 28px rgba(0,229,255,0.45);
    transform: scale(1.05);
  }
  body.light-mode #global-theme-btn {
    background: rgba(0,119,204,0.1);
    border-color: #0077cc;
    color: #0077cc;
    box-shadow: 0 0 16px rgba(0,119,204,0.2);
  }
</style>

<header class="hover smooth">
  {% unless site.show_minimal and site.navigation %}
    <h1><a href="{{ "/" | relative_url }}">{{ site.title | escape }}</a></h1>
  {% endunless %}
  {% include menu.html menu=site.navigation %}
</header>

<button id="global-theme-btn" onclick="toggleGlobalTheme()">
  <span id="g-ic">🌙</span>
  <span id="g-lbl">Dark</span>
</button>

{{ content }}

{%- if site.footer -%}
<footer class="hover">
  <div>{{ site.description }}</div>
  {% include menu.html menu=site.footer %}
</footer>
{%- endif -%}

<script>
  (function() {
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
    }
  })();

  document.addEventListener('DOMContentLoaded', function() {
    var isLight = document.body.classList.contains('light-mode');
    var ic = document.getElementById('g-ic');
    var lbl = document.getElementById('g-lbl');
    if (ic) ic.textContent = isLight ? '☀️' : '🌙';
    if (lbl) lbl.textContent = isLight ? 'Light' : 'Dark';
  });

  function toggleGlobalTheme() {
    var isLight = document.body.classList.toggle('light-mode');
    document.getElementById('g-ic').textContent = isLight ? '☀️' : '🌙';
    document.getElementById('g-lbl').textContent = isLight ? 'Light' : 'Dark';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  }
</script>
</html>
