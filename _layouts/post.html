---
layout: default
---

<style>
  .post-header { margin-bottom: 30px; }
  .post-header h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 10px; }
  .post-meta { color: #888; font-size: 14px; margin-bottom: 20px; }
  .post-content { line-height: 1.9; font-size: 16px; }
  .post-content p { margin-bottom: 15px; }
  .back-btn {
    display: inline-block;
    margin-bottom: 25px;
    background: #e94560;
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 14px;
  }
  .back-btn:hover { background: #c73652; }
</style>

<a class="back-btn" href="/myjourney">← Back to My Journey</a>

<div class="post-header">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">📅 {{ page.date | date: "%B %d, %Y" }}</p>
</div>

<div class="post-content">
  {{ content }}
</div>
